#WARNING: 
#	- Pretty much everything is case sensitive. I think.
#	- Usually the entire config fails to read and reverts to a default if there's even one mistake. So check your console for errors.

[general.enabled]
action_reader = true
spell_selector = true

[spell_selector]
#Might lower performance slightly while on. But if it's off you'll need to use the manual_refresh control.
auto_refresh = true

#Swaps out your spell if you try to cast the wrong kind of spell.
#This only deals with the incantation-sorcery divide. It will not do anything regarding any other form of restriction.
no_miscast = false

cast_slot = true

#===========================================================CONTROLS===========================================================#

#Guide:
#https://docs.rs/device_query/latest/device_query/keymap/enum.Keycode.html
#Every keyboard key should be covered in the above link. 
#
#Mouse: m1, m2, m3, m4, m5
#
#Usually try to avoid overlapping in-game binds with this mod's binds, except if it has "notify" in the name - in which case you must match them as their purpose is to notify the mod of certain keybinds.
#
#Each key can have modifiers, these are non-alphanumeric symbols put directly before the key name.
#Modifier list
#- ! means not held down
#	- Can be used to avoid overlapping controls
#		- e.g. scrolling up for next spell, scrolling up while holding down shift for next item. However scrolling up while holding down shift is still scrolling up. So to make it only one or the other, you can say the next spell binding requires shift to not be held down. These bindings are "ScrollUp !LShift" and "ScrollUp LShift" respectively.
#- ^ and _ mean key up and key down respectively. 
#	- Upon pressing or releasing the key, it activates at that exact moment. It is never active otherwise.
#		- Only one of either type per binding can be used as it's not possible to trigger multiple key up or key down per binding. 
#			- i.e Each input only has one key released or pressed, while the rest are neither. 
#		- Any ^ or _ key must be pressed or released after all other keys are satisfied.
#	- Shouldn't really be common, there are some interesting combinations where one control is key down and the other is key up forcing a key to do two consecutive inputs in order.
#- Don't make keys !, ^ or _ simultaneously.
#- A key is active as long as it is held down if it doesn't use !, ^ or _. 
#	- A key counts as held down if it is pressed, and not held down if it is released.
#		- So any time a ^ key is active, it would also be active if it were a ! key (but not vice-versa). A _ key would likewise be the same with an unmodified key.
#- Whitespaces represent AND.
#	- It is essentially a separator for keys that all belong to the same binding.
#	- Order shouldn't matter at all.
#- There's no OR modifier. 
#	- That would introduce ambiguity and a need for brackets and order of operations for very little gain.
#	- This does mean you need to create new bindings for each combination.
#		- But the point of the controls config isn't to compress everything to as little characters as possible. It's to have every binding explicitly listed in an immediately readable format.
#	- Instead, separate a new string in the array with ,.
#		- e.g. ["LShift A","LShift B"] instead of something like ["LShift (A|B)"].
#			- Ironically it would be nice to have both left and right shift as one but I'm already suffering when it comes to processing this config.

#==============================================================================================================================#

[action_reader]

[action_reader.controls]
#Updates where your last and first slots are for looping around. 
#If you change your spells memorised but don't refresh, some spells may be inaccessible or sometimes you'll end up in empty slots.
#If auto_refresh is false, make it something you'll press at least once after changing spells memorised, like the binding for going back out of a menu, or rolling.
manual_refresh = []
debug = []

[spell_selector.controls]
next = ["ScrollUp !LShift"]
prev = ["ScrollDown !LShift"]
to_0 = ["Key1 LShift !LControl"]
to_1 = ["Key2 LShift !LControl"]
to_2 = ["Key3 LShift !LControl"]
to_3 = ["Key4 LShift !LControl"]
to_4 = ["Key5 LShift"]
to_5 = ["Key6 LShift"]
to_6 = ["Key7 LShift"]
to_7 = ["Key8 LShift"]
to_8 = ["Key9 LShift"]
to_9 = ["Key0 LShift"]
to_10 = ["Key1 LShift LControl"]
to_11 = ["Key2 LShift LControl"]
to_12 = ["Key3 LShift LControl"]
to_13 = ["Key4 LShift LControl"]

#Used by cast_slot
cast = ["Grave"]
cast_0 = ["Key1 !LShift !LControl"]
cast_1 = ["Key2 !LShift !LControl"]
cast_2 = ["Key3 !LShift !LControl"]
cast_3 = ["Key4 !LShift !LControl"]
cast_4 = ["Key5 !LShift"]
cast_5 = ["Key6 !LShift"]
cast_6 = ["Key7 !LShift"]
cast_7 = ["Key8 !LShift"]
cast_8 = ["Key9 !LShift"]
cast_9 = ["Key0 !LShift"]
cast_10 = ["Key1 !LShift LControl"]
cast_11 = ["Key2 !LShift LControl"]
cast_12 = ["Key3 !LShift LControl"]
cast_13 = ["Key4 !LShift LControl"]

#Used by no_miscast.
notify_righthand = ["m1"]
notify_lefthand = ["m2"]